[env:Ghost]
board = ghost
build_src_filter =${env.build_src_filter} +<../boards/Ghost>
board_build.partitions = custom_16Mb.csv
board_build.arduino.memory_type = qio_opi
build_flags =
        ${env.build_flags}
        -Iboards/Ghost
        -Os
        -DIR_TX_PINS='{{"Header IO4", 4}, {"Header IO18", 18}}'
        -DIR_RX_PINS='{{"Header IO5", 5}, {"Header IO19", 19}}'
        -DRF_TX_PINS='{{"Header IO12", 12}, {"Header IO17", 17}}'
        -DRF_RX_PINS='{{"Header IO11", 11}, {"Header IO16", 16}}'
        -DDEVICE_NAME='"Ghost ESP32-S3 DevKitC ILI9341"'
lib_deps =
        ${env.lib_deps}
